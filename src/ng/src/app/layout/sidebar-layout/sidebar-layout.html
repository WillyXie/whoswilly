<div class="flex flex-col md:flex-row w-full max-w-7xl mx-auto items-start pt-20 pb-12 gap-6 md:gap-8 px-4 md:px-8">
  <!-- Left Column: Stacked Dropdown Panels -->
  <div class="flex flex-col gap-4 w-full md:w-64 shrink-0 sticky top-20 md:top-24 z-40">
    
    <!-- Sidebar Dropdown (Notes/Projects/Trips List) -->
    <aside 
      class="sidebar-dropdown"
      [class.expanded]="isExpanded()"
      (mouseenter)="expand()"
      (mouseleave)="collapse()"
    >
      <!-- Dropdown Header: Always visible -->
      <div class="dropdown-header">
        <div class="dropdown-header-title">
          <!-- Icon based on type -->
          <svg *ngIf="title === 'NOTES'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
          <svg *ngIf="title === 'PROJECTS'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
          </svg>
          <svg *ngIf="title === 'TRIPS'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
          <span>{{ title }}</span>
        </div>
        <svg class="dropdown-header-chevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </div>

      <!-- Dropdown List: Rolls down on hover -->
      <div class="dropdown-content-wrapper"
           [style.max-height]="isExpanded() ? '24rem' : '0'"
           [style.opacity]="isExpanded() ? '1' : '0'">
        <ul class="dropdown-list">
          <li *ngFor="let item of items" class="dropdown-list-item">
            <a 
              [routerLink]="['/' + item.link]" 
              routerLinkActive="active"
              class="dropdown-item"
            >
              <span class="dropdown-item-badge">
                {{ getAbbreviation(item.title) }}
              </span>
              <span>{{ item.title }}</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Table of Contents Dropdown -->
    <nav 
      class="toc-dropdown"
      [class.expanded]="isTocExpanded()"
      *ngIf="tocHeadings().length > 0"
      (mouseenter)="expandToc()"
      (mouseleave)="collapseToc()"
    >
      <!-- Dropdown Header: Always visible -->
      <div class="dropdown-header">
        <div class="dropdown-header-title">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
          <span>On this page</span>
        </div>
        <svg class="dropdown-header-chevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </div>

      <!-- Dropdown List: Rolls down on hover -->
      <div class="dropdown-content-wrapper"
           [style.max-height]="isTocExpanded() ? '24rem' : '0'"
           [style.opacity]="isTocExpanded() ? '1' : '0'">
        <ul class="dropdown-list">
          <li *ngFor="let heading of tocHeadings()" class="dropdown-list-item">
            <button
              [class.active]="activeTocId() === heading.id"
              [class.toc-h1]="heading.level === 1"
              [class.toc-h2]="heading.level === 2"
              [class.toc-h3]="heading.level === 3"
              (click)="scrollTo(heading.id)"
              class="dropdown-item"
            >
              {{ heading.text }}
            </button>
          </li>
        </ul>
      </div>
    </nav>
  </div>

  <!-- Main Content Area -->
  <div class="w-full flex-1 min-w-0 bg-white border border-gray-200 rounded-2xl p-4 md:p-8 shadow-sm note-content-area">
    <router-outlet></router-outlet>
  </div>
</div>
